name: Nura Deploy

# Continuous delivery for nura-app.
# - Pull requests → Vercel preview (when VERCEL_TOKEN is configured)
# - main → production after the reusable CI workflow passes
#
# Setup (once):
#   1. Create a Vercel token: https://vercel.com/account/tokens
#   2. gh secret set VERCEL_TOKEN
#   3. Org/project IDs are repo variables VERCEL_ORG_ID / VERCEL_PROJECT_ID
#   4. Optional: in Vercel → Project → Settings → Git, turn OFF automatic
#      production deployments so this workflow is the only production deployer.

on:
  push:
    branches: [main]
    paths:
      - "nura-app/**"
      - ".github/workflows/nura-deploy.yml"
      - ".github/workflows/nura-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "nura-app/**"
      - ".github/workflows/nura-deploy.yml"
      - ".github/workflows/nura-ci.yml"
  workflow_dispatch:

concurrency:
  group: nura-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Quality gate
    uses: ./.github/workflows/nura-ci.yml

  deploy-preview:
    name: Preview (Vercel)
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nura-app
    environment:
      name: nura-preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel token
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping Actions preview deploy. Vercel Git previews (if enabled) still apply. See nura-app/README.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.vercel.outputs.skip == 'false'
        run: npm install -g vercel@50

      - name: Pull Vercel env
        if: steps.vercel.outputs.skip == 'false'
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Build
        if: steps.vercel.outputs.skip == 'false'
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Deploy preview
        id: deploy
        if: steps.vercel.outputs.skip == 'false'
        run: |
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        if: steps.vercel.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `### Nura preview\n\n${url}\n\n_Deployed by Nura Deploy after CI passed._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes('### Nura preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-production:
    name: Production (Vercel)
    needs: checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nura-app
    environment:
      name: nura-production
      url: https://usenura.app
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel token
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping Actions production deploy. Vercel Git integration still deploys main when linked. See nura-app/README.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.vercel.outputs.skip == 'false'
        run: npm install -g vercel@50

      - name: Pull Vercel env
        if: steps.vercel.outputs.skip == 'false'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Build
        if: steps.vercel.outputs.skip == 'false'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Deploy production
        if: steps.vercel.outputs.skip == 'false'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Production deploy: $url"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
