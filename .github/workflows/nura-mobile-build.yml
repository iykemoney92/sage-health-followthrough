name: Nura Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "nura-mobile/**"
      - ".github/workflows/nura-mobile-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "nura-mobile/**"
      - ".github/workflows/nura-mobile-build.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: nura-mobile

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      # Debug builds self-sign with Gradle's built-in debug keystore, so this
      # produces an installable APK with no secrets required. A real Play
      # Store release needs a signing keystore added as a GitHub Secret and
      # `./gradlew bundleRelease` instead — see nura-mobile/README.md.
      - name: Build debug APK
        working-directory: nura-mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nura-android-debug-apk
          path: nura-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      # Unsigned simulator build — proves the app compiles on every push
      # without needing an Apple Developer account or certificates. A real
      # TestFlight/App Store build needs a signing certificate + provisioning
      # profile added as GitHub Secrets — see nura-mobile/README.md.
      - name: Build for iOS Simulator (unsigned)
        working-directory: nura-mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
