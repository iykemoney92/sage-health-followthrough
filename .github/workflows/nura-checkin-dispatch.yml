name: Nura check-in dispatcher

# Primary scheduler lives on the MigoAI production droplet
# (/opt/nura/scripts/dispatch-check-ins.sh via root crontab every minute).
# Keep this workflow for manual re-fire only — GitHub schedule is too unreliable
# for voice check-ins (jobs often queue for 15+ minutes or get cancelled).
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch due check-ins
        env:
          AGENT_TOOL_SECRET: ${{ secrets.NURA_AGENT_TOOL_SECRET }}
          FALLBACK_AGENT_SECRET: ${{ secrets.AGENT_TOOL_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          SECRET="${AGENT_TOOL_SECRET:-${FALLBACK_AGENT_SECRET:-}}"
          if [ -n "$SECRET" ]; then
            curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              -X POST "https://usenura.app/api/agent/trigger-check-ins" \
              -H "content-type: application/json" \
              -H "x-agent-secret: $SECRET" \
              -d '{}'
          elif [ -n "${CRON_SECRET:-}" ]; then
            curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              -X POST "https://usenura.app/api/agent/trigger-check-ins" \
              -H "content-type: application/json" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -d '{}'
          else
            echo "Missing NURA_AGENT_TOOL_SECRET / AGENT_TOOL_SECRET / CRON_SECRET"
            exit 1
          fi
          echo
          echo "Dispatched at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
